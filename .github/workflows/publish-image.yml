name: Publish image

on:
  push:
    branches:
      - main
    paths:
      - infra/**
      - src/**
      - package.json
      - bun.lock
      - bunfig.toml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The normalizer services are not in the infra inventory, so images are
# published without dispatching a deploy. The packages are linked to this
# repository in the crvouga-organization namespace, so the workflow token can
# push them; the repository has no working personal-namespace token.
jobs:
  normalizer:
    uses: crvouga-organization/personal/.github/workflows/publish.yml@main
    secrets:
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: normalizer
      dockerfile: infra/server.Dockerfile
      context: .
      image_owner: crvouga-organization
      notify_deploy: false

  normalizer_worker:
    uses: crvouga-organization/personal/.github/workflows/publish.yml@main
    secrets:
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: normalizer-worker
      dockerfile: infra/worker.Dockerfile
      context: .
      image_owner: crvouga-organization
      notify_deploy: false
