name: Publish image

on:
  push:
    branches:
      - main
    paths:
      - infra/**
      - src/**
      - package.json
      - bun.lock
      - bunfig.toml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# The normalizer services are not in the infra inventory, so images are
# published without dispatching a deploy. The ghcr.io/crvouga packages are
# linked to this repository, so the workflow token can push them.
jobs:
  normalizer:
    uses: crvouga/personal/.github/workflows/publish.yml@main
    secrets:
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: normalizer
      dockerfile: infra/server.Dockerfile
      context: .
      image_owner: crvouga
      notify_deploy: false

  normalizer_worker:
    uses: crvouga/personal/.github/workflows/publish.yml@main
    secrets:
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: normalizer-worker
      dockerfile: infra/worker.Dockerfile
      context: .
      image_owner: crvouga
      notify_deploy: false
